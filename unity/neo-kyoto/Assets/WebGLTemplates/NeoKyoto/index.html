<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Fill whatever frame itch.io gives us, rather than a fixed canvas size. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0B0E14;
      }
      #unity-container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0B0E14;
      }
      /* Loading state, themed to match the in-game terminal. */
      #unity-loading {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace;
        color: #35D6FF;
        letter-spacing: 0.14em;
        font-size: 14px;
      }
      #unity-loading-bar {
        width: 320px;
        height: 3px;
        margin-top: 18px;
        background: #1D2633;
      }
      #unity-loading-fill {
        width: 0%;
        height: 100%;
        background: #35D6FF;
        transition: width 0.2s ease-out;
      }
      #unity-error {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Consolas, monospace;
        color: #F24034;
        text-align: center;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="unity-loading">
        <div>NEO-KYOTO — CONNECTING</div>
        <div id="unity-loading-bar"><div id="unity-loading-fill"></div></div>
      </div>

      <div id="unity-error"></div>
    </div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var fill = document.querySelector("#unity-loading-fill");
      var errorBox = document.querySelector("#unity-error");

      createUnityInstance(canvas, {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        matchWebGLToCanvasSize: true
      }, function (progress) {
        fill.style.width = (progress * 100) + "%";
      }).then(function (instance) {
        loading.style.display = "none";
        // Keyboard input should go to the game, not the surrounding page.
        canvas.focus();
        canvas.addEventListener("click", function () { canvas.focus(); });
      }).catch(function (message) {
        loading.style.display = "none";
        errorBox.style.display = "flex";
        errorBox.textContent = "Failed to start:\n\n" + message;
      });
    </script>
  </body>
</html>
